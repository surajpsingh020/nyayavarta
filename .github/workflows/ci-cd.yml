name: Nyayavarta CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20.x"

jobs:
  # =========================================================================
  # 1. Backend CI: Linting, Unit/Integration Tests & GraphRAG Evaluation
  # =========================================================================
  backend-ci:
    name: Backend Tests & RAG Evaluation
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.18.0
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/nyayavarta_secret_2024
        options: >-
          --health-cmd "cypher-shell -u neo4j -p nyayavarta_secret_2024 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Backend & Dev Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Code Quality & Syntax Check
        working-directory: ./backend
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: nyayavarta_secret_2024
          NEO4J_DATABASE: neo4j
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest -v tests/test_graph_rag.py tests/test_phase2.py tests/test_phase3.py tests/test_phase5_integration.py

      - name: Run RAGAS Golden Dataset Evaluation
        working-directory: ./backend
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: nyayavarta_secret_2024
          NEO4J_DATABASE: neo4j
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m app.services.eval_service

      - name: Upload Evaluation Benchmark Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-benchmark-report
          path: backend/logs/rag_eval_benchmark.json
          if-no-files-found: ignore

  # =========================================================================
  # 2. Frontend CI: Linting, Typecheck & Next.js Production Build
  # =========================================================================
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # =========================================================================
  # 3. Docker Compose & Container Packaging Verification
  # =========================================================================
  docker-build:
    name: Docker Images Build & Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: nyayavarta-backend:ci

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: nyayavarta-frontend:ci

  # =========================================================================
  # 4. Continuous Deployment (CD): Production Release & Rollout
  # =========================================================================
  deploy:
    name: Continuous Deployment (CD)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deployment Status Notification
        run: |
          echo "=========================================================="
          echo " Nyayavarta Production Deployment Pipeline Triggered       "
          echo " Commit: ${{ github.sha }}                                 "
          echo " Actor:  ${{ github.actor }}                               "
          echo " Target: Main branch production rollout                    "
          echo " All CI checks passed: Backend, Frontend, RAGAS, & Docker  "
          echo "=========================================================="

      # Cloud deployment step: If DEPLOY_WEBHOOK_URL or SSH keys are provided,
      # trigger automatic production server refresh (e.g. AWS, Render, Railway, DigitalOcean).
      - name: Trigger Webhook / Remote Deploy (Optional)
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK" ]; then
            echo "Dispatching deployment webhook..."
            curl -s -X POST "$DEPLOY_WEBHOOK" || true
          else
            echo "DEPLOY_WEBHOOK_URL secret not configured; release verification complete."
          fi
